<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語文遊戲大廳</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: DotGothic16 for retro feel, Noto Sans TC for readability -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #1a1a2e;
            color: white;
            overflow-x: hidden;
        }

        .retro-font {
            font-family: 'DotGothic16', sans-serif;
        }

        /* Retro Grid Background Animation */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center bottom;
            transform: perspective(500px) rotateX(60deg) scale(2);
            transform-origin: center bottom;
            animation: gridMove 20s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 1000px; }
        }

        /* Glow effects */
        .glow-text {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-12">

    <!-- Background Grid -->
    <div class="grid-bg"></div>

    <!-- Header -->
    <header class="w-full text-center py-10 px-4">
        <h1 class="retro-font text-4xl md:text-6xl font-bold text-yellow-400 glow-text mb-2">
            <i class="fa-solid fa-gamepad mr-3"></i>遊戲學語文
        </h1>
        <p class="text-blue-200 text-lg md:text-xl mt-2 tracking-widest opacity-90">SELECT YOUR GAME</p>
    </header>

    <!-- Game Grid Container -->
    <main class="container mx-auto px-4 max-w-6xl z-10">
        <div id="game-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Game cards will be injected here by JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-16 text-gray-400 text-sm text-center">
        <p>© 2024 語文學習遊戲平台 | Level Up Your Vocabulary</p>
    </footer>

    <script>
        // Game Data Configuration
        const games = [
            {
                id: 'donkey-kong',
                name: '大金剛',
                engName: 'Donkey Kong',
                icon: 'fa-solid fa-shapes',
                customIcon: '🦍', 
                color: 'from-red-900 to-red-700',
                btnColor: 'bg-red-500 hover:bg-red-400',
                borderColor: 'border-red-500',
                linkWord: 'dk-word.html',
                linkPhrase: 'dk-phrase.html'
            },
            {
                id: 'antarctic',
                name: '南極大冒險',
                engName: 'Antarctic Adventure',
                icon: 'fa-solid fa-person-skiing',
                customIcon: '🐧',
                color: 'from-blue-900 to-blue-700',
                btnColor: 'bg-blue-500 hover:bg-blue-400',
                borderColor: 'border-blue-400',
                linkWord: 'penguin-word.html',
                linkPhrase: 'penguin-phrase.html'
            },
            {
                id: 'circus',
                name: '馬戲團',
                engName: 'Circus Charlie',
                icon: 'fa-solid fa-tent',
                customIcon: '🎪',
                color: 'from-purple-900 to-purple-700',
                btnColor: 'bg-purple-500 hover:bg-purple-400',
                borderColor: 'border-purple-400',
                linkWord: 'circus-word.html',
                linkPhrase: 'circus-phrase.html'
            },
            {
                id: 'duck-hunt',
                name: '打鴨子',
                engName: 'Duck Hunt',
                icon: 'fa-solid fa-bullseye',
                customIcon: '🦆',
                color: 'from-green-900 to-green-700',
                btnColor: 'bg-green-600 hover:bg-green-500',
                borderColor: 'border-green-500',
                linkWord: 'duck-word.html',
                linkPhrase: 'duck-phrase.html'
            },
            {
                id: 'pacman',
                name: '小精靈',
                engName: 'Pac-Man',
                icon: 'fa-solid fa-ghost',
                customIcon: '👻',
                color: 'from-yellow-900 to-yellow-700',
                btnColor: 'bg-yellow-600 hover:bg-yellow-500',
                borderColor: 'border-yellow-400',
                linkWord: 'pacman-word.html',
                linkPhrase: 'pacman-phrase.html'
            },
            {
                id: 'xianxia',
                name: '東方仙俠',
                engName: 'Immortal Legend',
                icon: 'fa-solid fa-dragon',
                customIcon: '🐉',
                color: 'from-cyan-900 to-cyan-700',
                btnColor: 'bg-cyan-600 hover:bg-cyan-500',
                borderColor: 'border-cyan-400',
                
                // Modified settings for single button layout
                type: 'single',             // Add this flag
                linkLabel: '成語遊戲',       // Label for the button
                link: 'xianxia-idiom.html'  // Single link file
            }
        ];

        const container = document.getElementById('game-container');

        // Function to create game cards
        function renderGames() {
            container.innerHTML = ''; // Clear existing content

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = `relative overflow-hidden rounded-xl border-2 ${game.borderColor} bg-gradient-to-br ${game.color} p-6 shadow-2xl card-hover group flex flex-col h-full`;
                
                // Determine Button HTML based on type
                let buttonsHtml = '';

                if (game.type === 'single') {
                    // Single Button Layout (For Xianxia)
                    buttonsHtml = `
                    <div class="relative z-10 mt-auto pt-4">
                        <button onclick="navigateTo('${game.name}', '${game.linkLabel}', '${game.link}')" 
                           class="w-full flex items-center justify-center py-4 px-4 rounded-lg ${game.btnColor} text-white shadow-lg transform hover:-translate-y-1 transition-transform border border-white/20">
                            <i class="fa-solid fa-scroll mr-2"></i>
                            <span class="font-bold text-lg tracking-wider">${game.linkLabel}</span>
                        </button>
                    </div>
                    `;
                } else {
                    // Standard Two Buttons Layout (Word/Phrase)
                    buttonsHtml = `
                    <div class="relative z-10 grid grid-cols-2 gap-4 mt-auto pt-4">
                        <button onclick="navigateTo('${game.name}', '單字版', '${game.linkWord}')" 
                           class="flex flex-col items-center justify-center py-3 px-2 rounded-lg bg-gray-800 border border-gray-600 hover:border-white hover:bg-gray-700 transition-colors text-white group-btn">
                            <span class="text-xs text-gray-400 mb-1">Level 1</span>
                            <span class="font-bold">單字版</span>
                        </button>
                        
                        <button onclick="navigateTo('${game.name}', '詞語版', '${game.linkPhrase}')" 
                           class="flex flex-col items-center justify-center py-3 px-2 rounded-lg ${game.btnColor} text-white shadow-lg transform hover:-translate-y-1 transition-transform">
                            <span class="text-xs text-white/80 mb-1">Level 2</span>
                            <span class="font-bold">詞語版</span>
                        </button>
                    </div>
                    `;
                }

                // Content HTML
                card.innerHTML = `
                    <!-- Background Icon Faded -->
                    <div class="absolute -right-4 -bottom-4 text-9xl opacity-10 select-none group-hover:opacity-20 transition-opacity">
                        ${game.customIcon}
                    </div>

                    <!-- Title Section -->
                    <div class="relative z-10 flex items-center mb-2">
                        <div class="text-4xl mr-4 shadow-sm filter drop-shadow-md">
                            ${game.customIcon}
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold tracking-wider retro-font text-white">${game.name}</h2>
                            <p class="text-xs text-gray-300 uppercase tracking-widest opacity-75">${game.engName}</p>
                        </div>
                    </div>
                    
                    <!-- Flexible spacer -->
                    <div class="flex-grow"></div>

                    <!-- Buttons Section -->
                    ${buttonsHtml}
                `;

                container.appendChild(card);
            });
        }

        // Simulating Navigation
        function navigateTo(gameName, version, url) {
            if (url === '#' || url === '') {
                showToast(`正在前往：${gameName} - ${version}`);
            } else {
                window.location.href = url;
            }
        }

        // Simple Toast Notification
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-white text-black px-6 py-3 rounded-full shadow-lg font-bold z-50 animate-bounce text-center whitespace-nowrap';
            toast.innerText = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 2000);
        }

        // Initialize
        renderGames();

    </script>
</body>
</html>
