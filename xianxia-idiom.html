<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成語仙俠傳：御劍衛道</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        :root {
            --bg-color: #2b2b2b;
            --paper-color: #f4ecd8;
            --panel-color: #3e2723;
            --accent-color: #c62828;
            --gold-color: #ffd700;
            --cyan-light: #e0f7fa;
            --cyan-dark: #006064;
            --text-color: #f4ecd8;
            --kai-font: "BiauKai", "DFKai-SB", "KaiU", "標楷體", "STKaiti", "Kaiti TC", "Kai", "AR PL UKai TW", "AR PL UKai CN", serif;
            --pixel-font: 'Press Start 2P', var(--kai-font), cursive;
            
            /* 遊戲場景動態變數預設值 */
            --stage-bg-1: #aed6f1;
            --stage-bg-2: #85c1e9;
            --hero-color: #3498db;
        }

        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--kai-font);
            font-weight: bold;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        .screen.active { display: flex; }

        #setup-screen {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23263238"/><path d="M0 0 L100 100 M100 0 L0 100" stroke="%2337474f" stroke-width="1"/></svg>');
            padding: 20px;
            text-align: center;
            z-index: 20;
            overflow-y: auto;
        }
        
        #setup-screen h1 {
            font-size: 3rem;
            color: var(--cyan-light);
            text-shadow: 4px 4px 0 var(--cyan-dark);
            margin-bottom: 20px;
            font-family: var(--kai-font);
        }

        .scroll-paper {
            background: var(--paper-color);
            color: #333;
            padding: 20px;
            border: 4px solid #546e7a;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
            width: 90%;
            max-width: 600px;
            margin-bottom: 20px;
            position: relative;
        }
        
        /* 關卡設定區塊樣式 */
        .level-block {
            background: #eceff1;
            border: 4px solid #78909c;
            padding: 10px;
            margin-bottom: 15px;
            text-align: left;
        }
        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            color: #37474f;
            font-size: 1.2rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #fff;
            border: 2px solid #b0bec5;
            color: #37474f;
            padding: 10px;
            font-size: 1.1rem;
            font-family: var(--kai-font);
            font-weight: bold;
            resize: none;
            outline: none;
        }
        
        .btn {
            background: #00bcd4;
            border: 4px solid #00838f;
            color: white;
            font-family: var(--kai-font);
            font-size: 1.5rem;
            padding: 15px 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #006064;
            margin: 10px;
            text-shadow: 2px 2px 0 #006064;
        }
        .btn:active { transform: translateY(6px); box-shadow: none; }
        .btn-secondary { background: #607d8b; border-color: #455a64; box-shadow: 0 6px 0 #263238; text-shadow: 2px 2px 0 #263238; }
        .btn-small { padding: 8px 15px; font-size: 1.1rem; margin: 5px; box-shadow: 0 4px 0 #006064;}
        .btn-small:active { transform: translateY(4px); box-shadow: none; }
        .btn-danger { background: #e74c3c; border-color: #c0392b; box-shadow: 0 4px 0 #922b21; text-shadow: 1px 1px 0 #922b21; }

        #qr-container {
            background: white;
            padding: 20px;
            border: 6px solid var(--cyan-dark);
            margin-top: 20px;
            margin-bottom: 50px;
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 500px;
        }
        
        #qr-code-canvas { margin-bottom: 10px; display: block; border: 2px solid #ccc; }

        #link-container {
            width: 100%; margin-top: 15px; border-top: 2px dashed #ccc; padding-top: 15px;
            display: flex; flex-direction: column; align-items: center;
        }
        #game-link-input {
            width: 100%; padding: 8px; margin-bottom: 10px; border: 2px solid #546e7a;
            background: #eee; color: #333; font-size: 1rem; border-radius: 4px;
        }

        #game-screen { justify-content: space-between; background: #2b2b2b; }

        /* 場景動態顏色套用 */
        .battle-stage {
            height: 45%; 
            width: 100%;
            background: repeating-linear-gradient(to bottom, var(--stage-bg-1), var(--stage-bg-1) 4px, var(--stage-bg-2) 4px, var(--stage-bg-2) 8px); 
            position: relative;
            overflow: hidden;
            border-bottom: 8px solid #34495e;
            transition: background 1s ease;
        }
        
        .cloud-bg {
            position: absolute;
            top: 0; left: 0; width: 200%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100" shape-rendering="crispEdges"><rect x="20" y="60" width="60" height="20" fill="white" opacity="0.6"/><rect x="30" y="50" width="40" height="10" fill="white" opacity="0.6"/><rect x="100" y="70" width="80" height="20" fill="white" opacity="0.7"/><rect x="110" y="60" width="60" height="10" fill="white" opacity="0.7"/><rect x="160" y="40" width="30" height="10" fill="white" opacity="0.5"/><rect x="165" y="35" width="20" height="5" fill="white" opacity="0.5"/></svg>');
            background-size: 400px 200px;
            animation: drift 30s linear infinite;
            pointer-events: none;
            z-index: 1;
            opacity: 0.8;
        }
        @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        .hud-bar {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; font-size: 1.1rem; text-shadow: 2px 2px 0 #000; color: #fff;
            pointer-events: none; font-family: var(--kai-font);
        }

        #score-display { color: #ffd700; background: rgba(0, 0, 0, 0.5); padding: 4px 8px; border: 3px solid #fff; }

        #hero-container {
            position: absolute; bottom: 12%; left: 8%; width: 80px; height: 80px;
            z-index: 5; transition: transform 0.1s;
        }

        .pixel-hero {
            width: 100%; height: 100%; filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.5));
            shape-rendering: crispEdges;
        }
        
        .pixel-hero-idle { animation: pixelIdle 1s steps(2) infinite; }
        @keyframes pixelIdle { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }

        .hero-attacking .pixel-hero { animation: pixelAttack 0.3s steps(4); }
        @keyframes pixelAttack { 
            0% { transform: translateX(0); } 
            25% { transform: translateX(10px) rotate(-5deg); }
            50% { transform: translateX(20px) rotate(5deg); }
            100% { transform: translateX(0); } 
        }

        #hero-speech {
            position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
            background: #fff; color: #000; padding: 4px 8px; border: 3px solid #000;
            font-weight: bold; font-size: 1.1rem; white-space: nowrap; opacity: 0;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.5); pointer-events: none;
            font-family: var(--kai-font); image-rendering: pixelated;
        }
        .show-speech { opacity: 1 !important; animation: floatUpPixel 1s steps(10) forwards; }

        .monster {
            position: absolute; bottom: 12%; width: 70px; height: 70px;
            display: flex; align-items: center; justify-content: center;
            z-index: 4; transition: transform 0.1s;
        }
        .pixel-monster {
            width: 100%; height: 100%; filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.5));
            shape-rendering: crispEdges; animation: monsterWalk 0.8s steps(4) infinite;
        }
        @keyframes monsterWalk { 0% { transform: translateY(0); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0); } }

        .monster.dead { animation: pixelDissolve 0.5s steps(5) forwards; }
        @keyframes pixelDissolve { 
            0% { opacity: 1; transform: scale(1); filter: brightness(1); } 
            100% { opacity: 0; transform: scale(1.2); filter: brightness(5) sepia(1) contrast(2); } 
        }
        
        .monster.boss-size { width: 110px; height: 110px; bottom: 10%; z-index: 5; }
        .monster.boss-size .pixel-monster { filter: drop-shadow(6px 6px 0 rgba(0,0,0,0.6)); }

        .score-float {
            position: absolute; color: #ffd700; font-family: var(--pixel-font);
            font-size: 1.2rem; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            animation: floatScorePixel 0.8s steps(8) forwards; pointer-events: none; z-index: 20;
        }
        @keyframes floatScorePixel { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }

        .projectile {
            position: absolute; width: 48px; height: 48px; z-index: 6;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges"><path d="M2 20 L4 22 L22 4 L20 2 Z" fill="%23ffd700"/><path d="M5 17 L7 19 L19 7 L17 5 Z" fill="%23fff"/><rect x="1" y="19" width="4" height="4" fill="%23c62828"/></svg>');
            background-size: contain; filter: drop-shadow(2px 2px 0 #c62828);
            transition: left 0.3s linear, top 0.3s linear;
        }

        .control-panel {
            flex: 1; background: #34495e; width: 100%; display: flex; flex-direction: column; 
            padding: 8px; box-shadow: 0 -8px 0 rgba(0,0,0,0.5); border-top: 8px solid #2c3e50; overflow: hidden; 
        }

        .input-display-area {
            display: flex; justify-content: center; margin-bottom: 8px; gap: 8px; flex-shrink: 0; height: 50px; 
        }
        .slot {
            width: 50px; height: 50px; background: #2c3e50; border: 4px solid #7f8c8d;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            color: #ecf0f1; font-family: var(--kai-font); box-shadow: inset 4px 4px 0 rgba(0,0,0,0.3);
        }
        .slot.filled {
            background: #3498db; border-color: #2980b9; color: #fff; box-shadow: inset -4px -4px 0 rgba(0,0,0,0.2);
        }

        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(18%, 1fr)); grid-auto-rows: 1fr;
            gap: 6px; flex: 1; width: 100%; padding: 2px; overflow-y: auto; align-content: start; 
        }
        
        .char-btn {
            min-height: 50px; background: #95a5a6; border: 4px solid #7f8c8d; color: #2c3e50;
            font-size: 1.5rem; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 0 #546e7a; text-shadow: 1px 1px 0 #fff;
            font-family: var(--kai-font); border-radius: 4px;
        }
        .char-btn:active { transform: translateY(4px); box-shadow: none; }
        .char-btn.used { 
            opacity: 0.3; pointer-events: none; transform: translateY(4px); box-shadow: none; 
            background: #7f8c8d; border-color: #546e7a; color: #34495e;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50; text-align: center;
        }
        .overlay h1 { font-size: 3rem; color: var(--gold-color); text-shadow: 4px 4px 0 #c62828; font-family: var(--kai-font); margin-bottom: 10px; }
        .overlay p { font-family: var(--kai-font); font-size: 1.5rem; color: white; text-shadow: 2px 2px 0 #000; margin: 20px 0; }

        #start-overlay { background: rgba(0, 0, 0, 0.85); }
        #start-btn-large { font-size: 2.5rem; padding: 20px 50px; border-width: 6px; animation: pulse 1.5s infinite; background: #e74c3c; border-color: #c0392b; color: #fff; }

        #explanation-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 40; animation: fadeIn 0.3s;
        }
        .exp-card { background: var(--paper-color); border: 6px solid #546e7a; box-shadow: 10px 10px 0 rgba(0,0,0,0.6); padding: 20px; width: 85%; max-width: 450px; text-align: center; position: relative; }
        .exp-title { font-size: 2.2rem; color: #c62828; margin-bottom: 10px; font-family: var(--kai-font); text-shadow: 1px 1px 0 #fff; }
        .exp-text { font-size: 1.4rem; color: #333; line-height: 1.5; margin-bottom: 20px; font-family: var(--kai-font); }
        .exp-btn { background: #27ae60; border: 4px solid #2ecc71; color: white; font-size: 1.4rem; padding: 10px 25px; cursor: pointer; box-shadow: 0 6px 0 #1e8449; font-family: var(--kai-font); }
        .exp-btn:active { transform: translateY(6px); box-shadow: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes floatUpPixel { 0% { transform: translate(-50%, 0); opacity: 0; } 20% { transform: translate(-50%, -20px); opacity: 1; } 100% { transform: translate(-50%, -60px); opacity: 0; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .shake { animation: shake 0.4s steps(4); }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    </style>
</head>
<body>

    <!-- 1. 設定畫面 -->
    <div id="setup-screen" class="screen active">
        <h1>🗡️ 成語仙俠傳</h1>
        <div class="scroll-paper" id="scroll-paper">
            <p style="font-size: 1.1rem; margin-top:0; color: #555;">自訂關卡 (最多6關)：請輸入 <b>成語:解釋</b></p>
            <div id="levels-container">
                <!-- JavaScript 將會在此動態生成關卡區塊 -->
            </div>
            <button class="btn btn-small btn-secondary" onclick="addLevelBlock()" id="btn-add-level" style="margin-top: 10px;">+ 新增下一關</button>
        </div>
        <div>
            <button class="btn" onclick="generateQR()">產生遊戲</button>
            <button class="btn btn-secondary" onclick="startGameDirectly()">教師試玩</button>
        </div>
        <div id="qr-container">
            <p style="font-size: 1.1rem; margin-bottom: 10px; text-shadow: 1px 1px 0 #fff; color: #333;">掃描 QR Code 進入遊戲：</p>
            <canvas id="qr-code-canvas"></canvas>
            
            <div id="link-container">
                <p style="font-size: 1rem; color: #555; margin-bottom:5px;">或複製下方連結：</p>
                <input type="text" id="game-link-input" readonly>
                <div>
                    <button class="btn btn-small" onclick="copyGameLink()">複製連結</button>
                    <button class="btn btn-secondary btn-small" onclick="openGameLink()">直接開啟</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 遊戲畫面 -->
    <div id="game-screen" class="screen">
        
        <div class="battle-stage" id="battle-stage">
            <div class="cloud-bg"></div>
            <div class="hud-bar">
                <div>關卡: <span id="wave-display">一</span> / <span id="max-wave">三</span></div>
                <div id="score-display">功德: <span style="font-family: var(--pixel-font);">0</span></div>
                <div id="hp-display">❤️❤️❤️❤️❤️</div>
            </div>

            <div id="hero-container">
                <div id="hero-speech">劍來!</div>
                <!-- 主角衣服使用 CSS 變數 var(--hero-color) 支援換裝 -->
                <svg class="pixel-hero pixel-hero-idle" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                    <rect x="12" y="2" width="8" height="4" fill="#2c3e50"/>
                    <rect x="10" y="4" width="2" height="6" fill="#2c3e50"/>
                    <rect x="20" y="4" width="2" height="6" fill="#2c3e50"/>
                    <rect x="12" y="6" width="8" height="6" fill="#f1c40f"/>
                    <rect x="14" y="8" width="2" height="2" fill="#000"/>
                    <rect x="18" y="8" width="2" height="2" fill="#000"/>
                    <rect x="10" y="12" width="12" height="18" fill="#ecf0f1"/>
                    <rect x="8" y="14" width="2" height="16" fill="var(--hero-color, #3498db)"/>
                    <rect x="22" y="14" width="2" height="16" fill="var(--hero-color, #3498db)"/>
                    <rect x="10" y="28" width="12" height="2" fill="var(--hero-color, #3498db)"/>
                    <rect x="10" y="20" width="12" height="2" fill="#2c3e50"/>
                    <rect x="14" y="20" width="4" height="2" fill="#f1c40f"/>
                    <rect x="6" y="18" width="4" height="4" fill="#f1c40f"/>
                    <rect x="22" y="18" width="4" height="4" fill="#f1c40f"/>
                    <rect x="10" y="14" width="2" height="4" fill="var(--hero-color, #3498db)" opacity="0.6"/>
                    <rect x="20" y="14" width="2" height="4" fill="var(--hero-color, #3498db)" opacity="0.6"/>
                </svg>
            </div>
            
            <div id="explanation-modal">
                <div class="exp-card">
                    <div id="exp-title" class="exp-title"></div>
                    <div id="exp-text" class="exp-text"></div>
                    <button class="exp-btn" onclick="resumeGame()">繼續戰鬥</button>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="input-display-area" id="input-slots">
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
            </div>
            
            <div class="grid-container" id="char-grid"></div>
        </div>

        <div id="start-overlay" class="overlay">
            <h1 style="color: #fff; text-shadow: 4px 4px 0 #000;">準備修煉</h1>
            <button id="start-btn-large" class="btn" onclick="onStartBtnClick()">開始戰鬥</button>
        </div>

        <div id="result-overlay" class="overlay">
            <h1 id="result-title">渡劫成功</h1>
            <p id="result-msg">功德圓滿: <span style="font-family: var(--pixel-font);">0</span></p>
            <button class="btn" onclick="resetGame()">重入輪迴</button>
        </div>
    </div>

    <script>
        // 定義像素怪物，包含新增的岩石巨魔(golem)
        const PIXEL_MONSTERS = {
            'ghost': '<rect x="4" y="4" width="24" height="24" fill="#bdc3c7"/><rect x="8" y="10" width="4" height="4" fill="#000"/><rect x="20" y="10" width="4" height="4" fill="#000"/><rect x="4" y="28" width="4" height="4" fill="#bdc3c7"/><rect x="12" y="28" width="4" height="4" fill="#bdc3c7"/><rect x="20" y="28" width="4" height="4" fill="#bdc3c7"/><rect x="24" y="28" width="4" height="4" fill="#bdc3c7"/>',
            'slime': '<rect x="4" y="16" width="24" height="12" fill="#2ecc71"/><rect x="8" y="12" width="16" height="4" fill="#2ecc71"/><rect x="12" y="8" width="8" height="4" fill="#2ecc71"/><rect x="10" y="20" width="4" height="4" fill="#27ae60"/><rect x="22" y="20" width="4" height="4" fill="#27ae60"/>',
            'bat': '<rect x="12" y="12" width="8" height="8" fill="#34495e"/><rect x="4" y="8" width="8" height="8" fill="#2c3e50"/><rect x="20" y="8" width="8" height="8" fill="#2c3e50"/><rect x="2" y="16" width="4" height="4" fill="#2c3e50"/><rect x="26" y="16" width="4" height="4" fill="#2c3e50"/><rect x="14" y="14" width="1" height="1" fill="#e74c3c"/><rect x="17" y="14" width="1" height="1" fill="#e74c3c"/>',
            'dragon': '<rect x="8" y="8" width="20" height="16" fill="#e74c3c"/><rect x="4" y="4" width="8" height="8" fill="#c0392b"/><rect x="20" y="4" width="4" height="4" fill="#c0392b"/><rect x="24" y="8" width="4" height="4" fill="#c0392b"/><rect x="8" y="24" width="4" height="4" fill="#c0392b"/><rect x="20" y="24" width="4" height="4" fill="#c0392b"/><rect x="2" y="12" width="6" height="4" fill="#f1c40f"/><rect x="6" y="10" width="2" height="2" fill="#000"/><rect x="26" y="16" width="4" height="4" fill="#c0392b"/>',
            'demon': '<rect x="8" y="4" width="16" height="20" fill="#8e44ad"/><rect x="4" y="8" width="4" height="12" fill="#9b59b6"/><rect x="24" y="8" width="4" height="12" fill="#9b59b6"/><rect x="8" y="24" width="8" height="4" fill="#8e44ad"/><rect x="20" y="24" width="8" height="4" fill="#8e44ad"/><rect x="12" y="8" width="8" height="8" fill="#2c3e50"/><rect x="14" y="10" width="2" height="2" fill="#e74c3c"/><rect x="18" y="10" width="2" height="2" fill="#e74c3c"/><rect x="12" y="2" width="2" height="4" fill="#f1c40f"/><rect x="18" y="2" width="2" height="4" fill="#f1c40f"/>',
            'golem': '<rect x="6" y="6" width="20" height="20" fill="#7f8c8d"/><rect x="4" y="10" width="24" height="12" fill="#95a5a6"/><rect x="10" y="12" width="4" height="4" fill="#f1c40f"/><rect x="18" y="12" width="4" height="4" fill="#f1c40f"/><rect x="8" y="26" width="6" height="6" fill="#7f8c8d"/><rect x="18" y="26" width="6" height="6" fill="#7f8c8d"/>'
        };

        // 六個關卡的場景配置與專屬怪物 (嚴守原色調擴展)
        const LEVEL_THEMES = [
            { bg1: '#aed6f1', bg2: '#85c1e9', hero: '#3498db', normal: 'slime', boss: 'ghost' },   // 第1關：水藍晴空
            { bg1: '#abebc6', bg2: '#82e0aa', hero: '#27ae60', normal: 'bat', boss: 'slime' },     // 第2關：碧綠仙林
            { bg1: '#fad7a1', bg2: '#f8c471', hero: '#d35400', normal: 'ghost', boss: 'bat' },     // 第3關：金黃大漠
            { bg1: '#d2b4de', bg2: '#bb8fce', hero: '#8e44ad', normal: 'golem', boss: 'dragon' },  // 第4關：紫幽魔境
            { bg1: '#d5dbdb', bg2: '#b2babb', hero: '#2c3e50', normal: 'demon', boss: 'golem' },   // 第5關：灰白雪嶺
            { bg1: '#f5b041', bg2: '#eb984e', hero: '#c0392b', normal: 'dragon', boss: 'demon' }   // 第6關：赤紅火山
        ];

        let levelDataArray = []; // 儲存所有關卡的資料：[ [{idiom, meaning},...], [{idiom, meaning},...] ]
        let currentLevelIdioms = []; 
        let selectedChars = [];
        let heroHP = 5;
        let currentLevel = 1;
        let maxLevels = 1;
        let monsters = []; 
        let score = 0; 
        let gameLoopId = null;
        let isGameOver = false;
        let isPaused = false;
        let pendingAttackIdiom = null;

        const CHINESE_NUMS = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];

        // 初始化設定介面
        let setupLevelCount = 0;
        
        function addLevelBlock(defaultText = "") {
            if (setupLevelCount >= 6) return alert("最多只能設定 6 個關卡！");
            
            setupLevelCount++;
            const container = document.getElementById('levels-container');
            const levelDiv = document.createElement('div');
            levelDiv.className = 'level-block';
            levelDiv.innerHTML = `
                <div class="level-header">
                    <span class="level-title">第 ${setupLevelCount} 關</span>
                </div>
                <textarea class="level-textarea" placeholder="每行一組成語:解釋\n範例：\n一石二鳥:比喻做一件事獲得兩種效果">${defaultText}</textarea>
            `;
            container.appendChild(levelDiv);
            updateLevelTitles();
        }

        function removeLevelBlock(btn) {
            btn.closest('.level-block').remove();
            setupLevelCount--;
            updateLevelTitles();
        }

        function updateLevelTitles() {
            const blocks = document.querySelectorAll('.level-block');
            setupLevelCount = blocks.length;
            blocks.forEach((block, index) => {
                block.querySelector('.level-title').innerText = `第 ${index + 1} 關`;
                let header = block.querySelector('.level-header');
                let existingBtn = header.querySelector('button');
                
                if (index === 0 && existingBtn) {
                    existingBtn.remove(); // 第一關不能刪除
                } else if (index > 0 && !existingBtn) {
                    let delBtn = document.createElement('button');
                    delBtn.className = 'btn-small btn-danger';
                    delBtn.style.margin = '0';
                    delBtn.innerText = '刪除此關';
                    delBtn.onclick = function() { removeLevelBlock(this); };
                    header.appendChild(delBtn);
                }
            });
            document.getElementById('btn-add-level').style.display = setupLevelCount >= 6 ? 'none' : 'inline-block';
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const data = urlParams.get('data');
            const mode = urlParams.get('mode');

            if (mode === 'play') {
                document.getElementById('setup-screen').classList.remove('active');
                document.getElementById('setup-screen').style.display = 'none';
                
                if (data) {
                    try {
                        const parsedData = JSON.parse(decodeURIComponent(atob(data)));
                        if (parsedData.length > 0 && Array.isArray(parsedData[0]) && Array.isArray(parsedData[0][0])) {
                            // 新格式: 支援多關卡
                            levelDataArray = parsedData.map(lvl => lvl.map(item => ({idiom: item[0], meaning: item[1]})));
                        } else {
                            // 舊格式相容: 全部當作第 1 關
                            levelDataArray = [parsedData.map(item => ({idiom: item[0], meaning: item[1]}))];
                        }
                        prepareGameFromQR();
                        return;
                    } catch (e) { 
                        console.error(e); 
                        alert("遊戲資料讀取失敗，請重新掃描 QR Code。");
                    }
                } else {
                    alert("找不到遊戲資料，請確認網址正確。");
                }
            } 
            
            // 預設給予第一關範例資料
            addLevelBlock("一石二鳥:比喻做一件事獲得兩種效果\n守株待兔:比喻拘泥守成，不知變通\n畫蛇添足:比喻多此一舉，反把事情弄糟");
        };

        function parseInput(text) {
            let parsed = [];
            const lines = text.split('\n');
            lines.forEach(line => {
                if(!line.trim()) return; 
                const parts = line.split(/[:：]/);
                if (parts.length >= 2) {
                    const idiom = parts[0].trim();
                    const meaning = parts.slice(1).join(':').trim();
                    if (idiom.length === 4) parsed.push({ idiom: idiom, meaning: meaning });
                } else if (parts[0].trim().length === 4) {
                    parsed.push({ idiom: parts[0].trim(), meaning: "無解釋" });
                }
            });
            return parsed;
        }

        function extractAllLevelsData() {
            let extractedData = [];
            const textareas = document.querySelectorAll('.level-textarea');
            textareas.forEach(ta => {
                let parsed = parseInput(ta.value);
                if (parsed.length > 0) extractedData.push(parsed);
            });
            return extractedData;
        }

        function generateQR() {
            const extracted = extractAllLevelsData();
            if (extracted.length === 0) return alert("請至少在一個關卡中輸入成語 (格式: 成語:解釋)");
            
            levelDataArray = extracted;
            const compactData = levelDataArray.map(lvl => lvl.map(item => [item.idiom, item.meaning]));
            const jsonStr = JSON.stringify(compactData);
            const encoded = btoa(encodeURIComponent(jsonStr)); 
            
            const currentUrl = window.location.href.split('?')[0];
            const fullUrl = `${currentUrl}?data=${encoded}&mode=play`;

            try {
                if (typeof QRious === 'undefined') throw new Error("QRious 庫未載入");
                const qr = new QRious({
                    element: document.getElementById('qr-code-canvas'),
                    value: fullUrl,
                    size: 300, 
                    level: 'L'
                });
                
                document.getElementById('game-link-input').value = fullUrl;
                document.getElementById('qr-container').style.display = 'flex';
                document.getElementById('qr-container').scrollIntoView({ behavior: 'smooth' });
            } catch (e) {
                alert("QR Code 生成失敗：" + e.message);
                console.error(e);
            }
        }

        function copyGameLink() {
            const input = document.getElementById('game-link-input');
            input.select();
            input.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(input.value).then(() => {
                alert("連結已複製到剪貼簿！");
            }).catch(err => alert("複製失敗，請手動複製。"));
        }

        function openGameLink() {
            const url = document.getElementById('game-link-input').value;
            if(url) window.open(url, '_blank');
        }

        function startGameDirectly() {
            const extracted = extractAllLevelsData();
            if (extracted.length === 0) return alert("請至少在一個關卡中輸入成語 (格式: 成語:解釋)");
            
            levelDataArray = extracted;
            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            document.getElementById('start-overlay').style.display = 'none'; 
            resetGame();
        }

        function prepareGameFromQR() {
            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            document.getElementById('start-overlay').style.display = 'flex';
        }

        function onStartBtnClick() {
            document.getElementById('start-overlay').style.display = 'none';
            resetGame();
        }

        function resetGame() {
            document.getElementById('result-overlay').style.display = 'none';
            heroHP = 5;
            score = 0;
            currentLevel = 1;
            isGameOver = false;
            isPaused = false;
            
            maxLevels = levelDataArray.length; 

            updateHP();
            updateScoreUI();
            document.getElementById('max-wave').innerText = toChineseNum(maxLevels);

            monsters.forEach(m => { if(m.el && m.el.parentNode) m.el.parentNode.removeChild(m.el); });
            monsters = [];
            document.querySelectorAll('.projectile').forEach(el => el.remove());
            document.querySelectorAll('.score-float').forEach(el => el.remove());
            if (gameLoopId) cancelAnimationFrame(gameLoopId);

            startLevel();
        }

        function toChineseNum(n) { return n <= 10 ? CHINESE_NUMS[n] : n; }

        function startLevel() {
            document.getElementById('wave-display').innerText = toChineseNum(currentLevel);
            monsters.forEach(m => { if(m.el && m.el.parentNode) m.el.parentNode.removeChild(m.el); });
            monsters = [];
            
            currentLevelIdioms = levelDataArray[currentLevel - 1];
            
            if (!currentLevelIdioms || currentLevelIdioms.length === 0) {
                gameOver(true);
                return;
            }

            // 套用場景動態主題 (地板顏色與主角衣服)
            const themeIndex = (currentLevel - 1) % LEVEL_THEMES.length;
            const theme = LEVEL_THEMES[themeIndex];
            document.documentElement.style.setProperty('--stage-bg-1', theme.bg1);
            document.documentElement.style.setProperty('--stage-bg-2', theme.bg2);
            document.documentElement.style.setProperty('--hero-color', theme.hero);

            let chars = currentLevelIdioms.map(item => item.idiom).join('').split('');
            chars.sort(() => Math.random() - 0.5);
            renderGrid(chars);
            
            spawnMonsters(currentLevelIdioms.length, theme);

            if(gameLoopId) cancelAnimationFrame(gameLoopId);
            lastTime = performance.now();
            isGameOver = false;
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function spawnMonsters(count, theme) {
            const stage = document.getElementById('battle-stage');
            for(let i=0; i<count; i++) {
                const el = document.createElement('div');
                el.className = 'monster';
                
                let monsterType;
                let isBoss = (i === count - 1); // 此關最後一隻必定是 Boss 大小
                
                if (isBoss) {
                    monsterType = theme.boss;
                    el.classList.add('boss-size');
                } else {
                    monsterType = theme.normal;
                }

                el.innerHTML = `
                    <svg class="pixel-monster" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                        ${PIXEL_MONSTERS[monsterType]}
                    </svg>
                `;

                // 根據成語數量拉長生成間距，避免重疊
                let startX = 100 + (i * 25);
                el.style.left = startX + '%';
                stage.appendChild(el);
                
                monsters.push({
                    id: Date.now() + i,
                    el: el,
                    x: startX,
                    speed: 2 + (currentLevel * 0.4), // 隨著關卡微幅加速
                    isDead: false,
                    points: isBoss ? 500 : 100 
                });
            }
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            if (isGameOver) return;
            
            if (isPaused) {
                lastTime = timestamp;
                gameLoopId = requestAnimationFrame(gameLoop);
                return;
            }

            const deltaTime = (timestamp - lastTime) / 1000; 
            lastTime = timestamp;

            monsters.forEach(m => {
                if (m.isDead) return;
                m.x -= m.speed * deltaTime * 2.5;
                m.el.style.left = m.x + '%';
                
                if (m.x < 12) { 
                    damageHero();
                    killMonster(m, false);
                }
            });

            const aliveMonsters = monsters.filter(m => !m.isDead);
            if (aliveMonsters.length === 0 && monsters.length > 0) {
                setTimeout(nextLevel, 1000);
                return;
            }
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function damageHero() {
            heroHP--;
            updateHP();
            const hero = document.getElementById('hero-container');
            hero.style.filter = "brightness(5) sepia(1) saturate(5) hue-rotate(-50deg)";
            setTimeout(() => { hero.style.filter = ""; }, 200);
            if (heroHP <= 0) gameOver(false);
        }

        function updateHP() {
            let hearts = "";
            for(let i=0; i<5; i++) hearts += (i < heroHP) ? "❤️" : "🖤";
            document.getElementById('hp-display').innerText = hearts;
        }

        function updateScoreUI() {
            document.getElementById('score-display').innerHTML = `功德: <span style="font-family: var(--pixel-font);">${score}</span>`;
        }

        function killMonster(monster, byPlayer) {
            monster.isDead = true;
            monster.el.classList.add('dead');
            
            if (byPlayer) {
                score += monster.points;
                updateScoreUI();
                
                const floatText = document.createElement('div');
                floatText.className = 'score-float';
                floatText.innerText = "+" + monster.points;
                floatText.style.left = monster.el.style.left;
                floatText.style.bottom = monster.el.classList.contains('boss-size') ? '40%' : '30%';
                document.getElementById('battle-stage').appendChild(floatText);
                setTimeout(() => floatText.remove(), 1000);
            }

            setTimeout(() => { if(monster.el.parentNode) monster.el.remove(); }, 500);
        }

        function nextLevel() {
            if (currentLevel >= maxLevels) {
                gameOver(true);
            } else {
                currentLevel++;
                startLevel();
            }
        }

        function gameOver(victory) {
            isGameOver = true;
            cancelAnimationFrame(gameLoopId);
            const overlay = document.getElementById('result-overlay');
            const title = document.getElementById('result-title');
            const msg = document.getElementById('result-msg');
            
            overlay.style.display = 'flex';
            if (victory) {
                title.innerText = "渡劫成功";
                title.style.color = "var(--gold-color)";
                title.style.textShadow = "4px 4px 0 #c62828";
                msg.innerHTML = `功德圓滿: <span style="font-family: var(--pixel-font);">${score}</span>`;
            } else {
                title.innerText = "道消魔長";
                title.style.color = "#e74c3c";
                title.style.textShadow = "4px 4px 0 #2c3e50";
                msg.innerHTML = `累積功德: <span style="font-family: var(--pixel-font);">${score}</span>`;
            }
        }

        function renderGrid(chars) {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = '';
            selectedChars = [];
            updateSlotsUI();

            chars.forEach((char) => {
                const btn = document.createElement('div');
                btn.className = 'char-btn';
                btn.innerText = char;
                btn.onclick = () => handleCharClick(char, btn);
                grid.appendChild(btn);
            });
        }

        function handleCharClick(char, btn) {
            if (isGameOver || isPaused || btn.classList.contains('used') || selectedChars.length >= 4) return;
            selectedChars.push({char, btn});
            btn.classList.add('used');
            updateSlotsUI();
            if (selectedChars.length === 4) checkAnswer();
        }

        function updateSlotsUI() {
            const slots = document.querySelectorAll('.slot');
            slots.forEach(s => { s.innerText = ''; s.classList.remove('filled'); });
            selectedChars.forEach((obj, i) => {
                slots[i].innerText = obj.char;
                slots[i].classList.add('filled');
            });
        }

        function checkAnswer() {
            const answer = selectedChars.map(o => o.char).join('');
            const found = currentLevelIdioms.find(item => item.idiom === answer);
            
            if (found) {
                isPaused = true;
                pendingAttackIdiom = answer;
                showExplanation(found);
                selectedChars = [];
                setTimeout(updateSlotsUI, 200);
            } else {
                document.getElementById('input-slots').classList.add('shake');
                setTimeout(() => {
                    document.getElementById('input-slots').classList.remove('shake');
                    selectedChars.forEach(o => o.btn.classList.remove('used'));
                    selectedChars = [];
                    updateSlotsUI();
                }, 400);
            }
        }

        function showExplanation(item) {
            const modal = document.getElementById('explanation-modal');
            const title = document.getElementById('exp-title');
            const text = document.getElementById('exp-text');

            title.innerText = item.idiom;
            text.innerText = item.meaning;
            modal.style.display = 'flex';
            speak(item.idiom + "。" + item.meaning);
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 1.0; 
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function resumeGame() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('explanation-modal').style.display = 'none';
            isPaused = false;
            if (pendingAttackIdiom) {
                performAttack(pendingAttackIdiom);
                pendingAttackIdiom = null;
            }
        }

        function performAttack(text) {
            const bubble = document.getElementById('hero-speech');
            bubble.innerText = text;
            bubble.classList.remove('show-speech');
            void bubble.offsetWidth; 
            bubble.classList.add('show-speech');

            document.getElementById('hero-container').classList.add('hero-attacking');
            setTimeout(() => document.getElementById('hero-container').classList.remove('hero-attacking'), 300);

            const alive = monsters.filter(m => !m.isDead).sort((a,b) => a.x - b.x);
            if (alive.length > 0) {
                const target = alive[0];
                const projectile = document.createElement('div');
                projectile.className = 'projectile';
                projectile.style.left = '18%'; 
                projectile.style.bottom = '20%';
                document.getElementById('battle-stage').appendChild(projectile);
                setTimeout(() => { projectile.style.left = target.x + '%'; }, 20);
                setTimeout(() => {
                    projectile.remove();
                    killMonster(target, true);
                }, 300);
            }
        }
    </script>
</body>
</html>
